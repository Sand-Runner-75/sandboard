# Publishes the built site to GitHub Pages. OFF by default: it runs only when
# started by hand AND the repository variable PAGES_ENABLED is "true". Turning
# it on is publishing and is the owner's decision (see docs/RELEASE.md).
name: Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag or branch to publish (default: main). Use an older commit to roll back."
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Tests
        env:
          PUBLIC_AUDIT_TERMS: ${{ secrets.PUBLIC_AUDIT_TERMS }}
        run: python3 scripts/ci_step.py --log ci-log.txt -- python3 -m unittest discover -s tests -v
      - name: Build
        env:
          PUBLIC_AUDIT_TERMS: ${{ secrets.PUBLIC_AUDIT_TERMS }}
        run: python3 scripts/ci_step.py --log ci-log.txt -- python3 scripts/build.py --out dist
      - name: Public audit before upload
        # Runs even after a failed step; the upload below still needs every step to pass.
        if: always()
        env:
          PUBLIC_AUDIT_TERMS: ${{ secrets.PUBLIC_AUDIT_TERMS }}
        run: python3 scripts/public_audit.py --build-dir dist --log ci-log.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
